[flake8]
max-line-length = 88
inline-quotes = double
exclude =
    .git,
    __pycache__,
    .venv,
    frontend_dist,
    static,
    tests,
    src/init_db.py

ignore =
    B008,
    WPS430,
    WPS404,
    WPS306,
    WPS125,
    WPS305,
    WPS110,
    WPS202,
    D100,
    D104,
    D101,
    D102,
    D103,
    D107,
    WPS432,
    WPS348,
    DAR101,
    DAR201,
    DAR401,
    DAR301,
    WPS111,
    WPS210,
    WPS420,
    WPS604,
    C812,
    WPS226,
    WPS214,
    WPS211,
    WPS115,
    WPS221,
    E402,
    I001,
    I005

[mypy]
strict = True
ignore_missing_imports = True